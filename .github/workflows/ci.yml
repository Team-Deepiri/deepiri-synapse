on:
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
        
      - name: Run Tests
        run: python -m pytest tests/
        env: 
          PYTHONPATH: ${{ github.workspace }}/app/deepiri-modelkit:${{ github.workspace }}/app      
  
