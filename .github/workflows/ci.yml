on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint
        run: |
          pip install ruff
          ruff check .
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
        
      - name: Run Tests
        run: python -m pytest tests/
        env: 
          PYTHONPATH: ${{ github.workspace }}/app/deepiri-modelkit:${{ github.workspace }}/app      
  
