name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Restore push counter
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: push-count.txt
          key: pushcounter-${{ github.workflow }}-${{ github.ref }}
          restore-keys: |
            pushcounter-${{ github.workflow }}-${{ github.ref }}

      - name: Budget pushes (run every 5th)
        id: gate
        env:
          RUN_NAME: ${{ github.event_name }}
        run: |
          if [ "$RUN_NAME" != "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(cat push-count.txt 2>/dev/null || echo 0)
          count=$((count + 1))
          echo "$count" > push-count.txt
          if [ $((count % 5)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist updated counter
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: push-count.txt
          key: pushcounter-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}

  analyze:
    needs: gate
    if: needs.gate.outputs.should_run != 'false'
    timeout-minutes: 20
    name: Analyze (python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
